name: immgenT-CD8
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  - python=3.9.23
  - pip=25.2
  # Core scientific stack
  - numpy=1.26.4
  - pandas=2.0.3
  - scipy=1.13.1
  - matplotlib=3.9.4
  - seaborn=0.13.2
  - h5py=3.14.0
  - openpyxl=3.1.5
  # Notebook runtime
  - ipykernel=6.30.1
  - ipython=8.18.1
  # Single-cell / multi-omics
  - muon=0.1.7
  - scanpy=1.10.3
  # Enrichment / plotting helpers
  - gseapy=1.1.11
  - pip:
      - adjustText==1.3.0
