name: Deploy immgenT project sites (Treg/CD4)

on:
  push:
    branches:
      - main
    paths:
      - "Treg_paper/**"
      - "CD4_paper/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/Treg_paper
          mkdir -p _site/CD4_paper

          cp -R Treg_paper/docs/. _site/Treg_paper/
          cp -R CD4_paper/docs/. _site/CD4_paper/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
